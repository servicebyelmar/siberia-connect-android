<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Siberia Connect</title>
<style>
:root{
  --bg:#0B0D10; --panel:#14191F; --panel2:#1B222A; --line:rgba(255,255,255,.08);
  --ice:#8FDBFF; --ice2:#4FC3F7; --tint:rgba(143,219,255,.09);
  --tx:#EAF0F5; --mut:#A3B0BC; --warn:#F0C36A; --bad:#FF9C9C;
  --teal:#3DDBC0; --amber:#F0B84A; --orange:#FF8A3D; --off:#3A444E;
  --gut:1rem; --r:14px; --navh:4.6rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;line-height:1.35;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:.75rem var(--gut) calc(var(--navh) + 1rem)}
.screen{display:none}.screen.on{display:block}
h1{font-size:1.4rem;margin:.25rem 0 .9rem;font-weight:700}
h2{font-size:1rem;font-weight:700;color:var(--mut);margin:1.5rem 0 .5rem}
.sub{color:var(--mut)}

/* ───── общие элементы ───── */
.card{border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden}
.fl{width:24px;height:16px;border-radius:3px;display:block;flex:none;object-fit:cover;background:var(--panel2)}
.ico24{width:24px;height:16px;flex:none;display:grid;place-items:center;color:var(--ice)}
.ico24 svg{width:16px;height:16px}
.chev{width:18px;height:18px;color:var(--mut);flex:none;transition:transform .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;min-height:2.75rem;padding:.55rem 1.1rem;border-radius:10px;font-weight:700;font-size:.95rem;background:var(--ice);color:#04202E;line-height:1.2}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.small{min-height:2.5rem;padding:.4rem .95rem;font-size:.9rem}
.btn[disabled]{opacity:.5}
.acts{display:flex;flex-wrap:wrap;gap:.5rem}

/* индикатор задержки: четыре восходящие полоски */
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.sig i{display:block;width:3px;border-radius:1px;background:var(--off)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig.c-teal i.on{background:var(--teal)}.sig.c-amber i.on{background:var(--amber)}.sig.c-orange i.on{background:var(--orange)}
.sigtx{font-size:.8rem;color:var(--mut);white-space:nowrap;flex:none}
.live{font-size:.75rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;border:1px solid rgba(143,219,255,.5);color:var(--ice);white-space:nowrap;flex:none}

/* ───── главная ───── */
.home{display:flex;flex-direction:column;min-height:calc(100vh - var(--navh) - 1.75rem)}
.brand{font-size:.95rem;font-weight:700;color:var(--mut);letter-spacing:.02em}
.stat{width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:1.25rem 0 .25rem;min-height:7rem}
.st{font-size:min(2rem,10vw);font-weight:800;line-height:1.15;letter-spacing:.2px;overflow-wrap:break-word;max-width:100%}
.st.on{color:var(--ice)}.st.error{color:var(--warn)}
.tm{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";color:var(--mut);font-size:1.05rem;margin-top:.3rem;min-height:1.5rem}
.msg{margin-top:.35rem;font-size:.95rem;color:#F6DDA6;min-height:1.3rem;max-width:22rem}
.msg small{display:block;color:var(--mut);font-size:.82rem;margin-top:.15rem}

/* сцена кнопки: область шерсти/кристалла в 1,5 раза шире кнопки, край растворяется в фоне */
.stage{position:relative;width:min(80vw,19rem);aspect-ratio:1;margin:.25rem auto 0;display:grid;place-items:center;flex:none}
.stage>*{position:absolute}
.fl-mask{-webkit-mask-image:radial-gradient(circle closest-side,#000 68%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 68%,transparent 100%)}
.crystal.fl-mask{-webkit-mask-image:radial-gradient(circle closest-side,#000 88%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 88%,transparent 100%)}
.fur{inset:0;background:#2b2e32 url(fur.jpg) center/cover;filter:brightness(1.12) contrast(1.1);opacity:1;transition:opacity .9s ease}
.stage[data-s=on] .fur{opacity:.2}
.crystal{inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s ease;color:#BFEAFF}
.stage[data-s=on] .crystal{opacity:1}
.snow{inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.stage[data-s=on] .snow{opacity:1}
.wave{left:50%;top:50%;width:56%;aspect-ratio:1;margin:-28% 0 0 -28%;border-radius:50%;border:1.5px solid rgba(220,240,255,.6);
  box-shadow:0 0 14px rgba(190,230,255,.35),inset 0 0 16px rgba(190,230,255,.22);opacity:0;pointer-events:none}
.stage[data-s=connecting] .wave{animation:wave 2.4s ease-out infinite}
.stage[data-s=connecting] .wave.w2{animation-delay:1.2s}
@keyframes wave{0%{transform:scale(.9);opacity:0}14%{opacity:.8}100%{transform:scale(1.7);opacity:0}}
.pbtn{width:66.7%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.07);
  background:radial-gradient(circle at 36% 28%,#3a4249 0%,#242a30 52%,#171b1f 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.12),inset 0 -10px 18px rgba(0,0,0,.45),0 12px 26px rgba(0,0,0,.55);
  transition:transform .12s ease,box-shadow .12s ease,background .6s ease;color:#E8EEF3}
.pbtn svg{width:34%;height:34%;display:block}
.stage[data-s=connecting] .pbtn{transform:translateY(2px) scale(.955);box-shadow:inset 0 5px 14px rgba(0,0,0,.6),inset 0 -2px 1px rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.5)}
.stage[data-s=on] .pbtn{color:#06202F;border-color:rgba(255,255,255,.25);
  background:radial-gradient(circle at 36% 26%,#D6F3FF 0%,#9EDDFA 48%,#63BFEA 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -10px 18px rgba(30,110,160,.35),0 10px 30px rgba(79,195,247,.35),0 12px 26px rgba(0,0,0,.45)}
.stage[data-s=on] .pbtn:active{transform:translateY(2px) scale(.965)}
.cap{text-align:center;font-weight:700;font-size:1rem;color:var(--ice);margin-top:.5rem;min-height:1.5rem}
.srv{display:flex;align-items:center;gap:.75rem;width:100%;padding:.8rem var(--gut);border-radius:var(--r);background:var(--panel);border:1px solid var(--line);min-height:3.6rem;margin-top:.9rem}
.srv:active{background:var(--panel2)}
.srv .t{flex:1 1 0;min-width:0}
.srv .sig,.srv .sigtx{margin-left:auto}
.srv .t b{display:block;font-size:1rem;font-weight:600;overflow-wrap:break-word}
.srv .t span{display:block;color:var(--mut);font-size:.85rem}
.notice{margin-top:.75rem;padding:.8rem var(--gut);border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-size:.92rem}
.notice b{display:block;margin-bottom:.2rem}
.notice .acts{margin-top:.6rem}

/* ───── серверы ───── */
.head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.head h1{margin-right:auto}
.chk{display:inline-flex;align-items:center;min-height:2.5rem;padding:.4rem .9rem;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:.9rem;font-weight:600;color:var(--ice)}
.chk[disabled]{opacity:.6}
.row{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem var(--gut);min-height:3.4rem;border-top:1px solid var(--line);flex-wrap:wrap;row-gap:.3rem}
.row:first-child{border-top:0}
.row:active{background:var(--panel2)}
.row.sel{background:var(--tint)}
.row.off{opacity:.55}
.row .t{flex:1 1 7rem;min-width:0}
.row .t b{display:block;font-weight:600;font-size:1rem;overflow-wrap:break-word}
.row .t span{display:block;color:var(--mut);font-size:.88rem;margin-top:.05rem;overflow-wrap:break-word}
.row .live,.row .sig,.row .sigtx{margin-left:auto}
.row .live+.sig,.row .live+.sigtx{margin-left:0}
.auto{margin-bottom:.75rem}
.auto .row{border-top:0}
.nodes{display:none;background:rgba(255,255,255,.02)}
.grp.open .nodes{display:block}
.grp.open>.row .chev{transform:rotate(90deg)}
.nodes .row{padding-left:calc(var(--gut) + 24px + .75rem)}
.note{margin:.75rem 0 0;color:var(--mut);font-size:.92rem}

/* ───── настройки ───── */
.set{display:flex;align-items:center;gap:.75rem;width:100%;padding:.8rem var(--gut);min-height:3.5rem;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set:active{background:var(--panel2)}
.set .t{flex:1 1 0;min-width:0}
.set .t b{display:block;font-weight:600;font-size:1rem;overflow-wrap:break-word}
.set .t span{display:block;color:#B4C0CB;font-size:.9rem;margin-top:.1rem;overflow-wrap:break-word}
.set .val{color:var(--ice);font-weight:600;font-size:.95rem;flex:none}
.set.danger .t b{color:var(--bad)}
.sw{width:46px;height:27px;border-radius:999px;background:#2A333C;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#9aa6b1;transition:transform .2s,background .2s}
.sw[aria-checked=true]{background:rgba(79,195,247,.35)}
.sw[aria-checked=true]::after{transform:translateX(19px);background:var(--ice)}
.ver{margin:1.5rem 0 0;color:var(--mut);font-size:.82rem;overflow-wrap:break-word}

/* ───── навигация ───── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0B0D10;border-top:1px solid var(--line)}
.nav>div{max-width:560px;margin:0 auto;display:flex;padding:.3rem .5rem calc(.3rem + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.45rem .1rem;border-radius:12px;color:var(--mut);text-align:center}
.nav svg{width:1.45rem;height:1.45rem}
.nav span{font-size:min(.76rem,4.2vw);font-weight:600;line-height:1.15;overflow-wrap:break-word;word-break:normal;max-width:100%}
.nav button.on{color:var(--ice)}

/* ───── шторка, тост ───── */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}.shade.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:1rem var(--gut) calc(1rem + env(safe-area-inset-bottom,0px));display:none}
.sheet.on{display:block}
.sheet h3{margin:.1rem 0 .5rem;font-size:1.15rem}
.sheet p{color:var(--mut);font-size:.95rem;margin:.3rem 0 .8rem}
.sheet .acts{margin-top:.9rem}.sheet .acts .btn{flex:1 1 9rem}
.inp{width:100%;min-height:2.9rem;padding:.6rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:1.05rem}
.apps .row{padding:.55rem .75rem}
.apps img.ai{width:2.2rem;height:2.2rem;border-radius:.5rem;flex:none;background:var(--panel2)}
.cb{width:22px;height:22px;border-radius:5px;border:2px solid #3b4651;flex:none;display:grid;place-items:center;margin-left:auto}
.sel .cb{background:var(--ice2);border-color:var(--ice2)}.sel .cb::after{content:"✓";color:#04202e;font-weight:900;font-size:.85rem;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + .75rem);transform:translateX(-50%);z-index:60;max-width:calc(100% - 2rem);padding:.65rem 1rem;border-radius:12px;background:#222B34;border:1px solid var(--line);color:var(--tx);font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* крупный шрифт: слова не рвутся, текст не растёт быстрее ширины экрана */
.set .t b,.row .t b,.srv .t b{font-size:min(1rem,5.3vw)}
.set .t span,.row .t span,.srv .t span{font-size:min(.9rem,4.6vw)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5S14.6 18.1 12 20.5C9.4 18.1 8.1 15.3 8.1 12S9.4 5.9 12 3.5z"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></g></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5 5 13.5h5.5l-1 8L19 9.5h-5.8z" fill="currentColor"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <section class="screen on" id="s-home" aria-label="Главная">
    <div class="home">
      <div class="brand">Siberia Connect</div>
      <div class="stat">
        <div class="st" id="stTitle" role="status" aria-live="polite">Отключено</div>
        <div class="tm" id="timer"></div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="stage" id="stage" data-s="off">
        <div class="fur fl-mask" aria-hidden="true"></div>
        <svg class="crystal fl-mask" viewBox="-100 -100 200 200" aria-hidden="true">
          <g id="armset" fill="none" stroke="currentColor" stroke-linecap="round">
            <g id="arm"><path d="M0 0V-96" stroke-width="3.2"/><path d="M0-72 -13-85M0-72 13-85M0-84 -9-93M0-84 9-93" stroke-width="2.2"/><path d="M0-96 -4-90M0-96 4-90" stroke-width="2"/></g>
            <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/>
            <use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
          </g>
        </svg>
        <canvas class="snow fl-mask" id="snow" aria-hidden="true"></canvas>
        <div class="wave" aria-hidden="true"></div><div class="wave w2" aria-hidden="true"></div>
        <button class="pbtn" id="cta" type="button" aria-label="Подключиться">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3.2v8.4"/><path d="M7.2 6.6a7.6 7.6 0 1 0 9.6 0"/></g></svg>
        </button>
      </div>
      <div class="cap" id="cap">Подключиться</div>
      <div id="notice"></div>
      <button class="srv" id="srvRow" type="button"></button>
    </div>
  </section>
  <section class="screen" id="s-servers" aria-label="Серверы"></section>
  <section class="screen" id="s-settings" aria-label="Настройки"></section>
</div>

<nav class="nav" id="nav" aria-label="Разделы"><div>
  <button type="button" data-t="home" class="on"><svg><use href="#i-home"/></svg><span>Главная</span></button>
  <button type="button" data-t="servers"><svg><use href="#i-globe"/></svg><span>Серверы</span></button>
  <button type="button" data-t="settings"><svg><use href="#i-gear"/></svg><span>Настройки</span></button>
</div></nav>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var N = window.SCNative || null;
function nat(m){ try{ if(N && typeof N[m]==='function') return N[m].apply(N, Array.prototype.slice.call(arguments,1)); }catch(e){} return undefined; }
function natJSON(m, def){ try{ var r = nat(m); return r ? JSON.parse(r) : def; }catch(e){ return def; } }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function plural(n,a,b,c){ var m=n%10,h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; }

var S = { state:'off', err:'', since:0, off:0, nodes:[], auto:null, autoOn:false, sel:null, act:null, live:null,
          tab:'home', open:{}, lockUntil:0, switching:0, connAt:0, acct:'', incident:'', me:null, pingBusy:false, pingAt:0, build:null };

/* ───────── узлы: страна по данным узла (флаг в названии), название ───────── */
var CC = {NL:'Нидерланды',FI:'Финляндия',RU:'Россия',KZ:'Казахстан',DE:'Германия',SE:'Швеция',LV:'Латвия',AT:'Австрия',US:'США',LT:'Литва',
  JP:'Япония',FR:'Франция',GB:'Великобритания',TR:'Турция',PL:'Польша',EE:'Эстония',CH:'Швейцария',CA:'Канада',KR:'Корея',SG:'Сингапур',
  AE:'ОАЭ',AM:'Армения',GE:'Грузия',UA:'Украина',BY:'Беларусь',CZ:'Чехия',ES:'Испания',IT:'Италия',NO:'Норвегия',RO:'Румыния',BG:'Болгария'};
function flagCC(str){
  var m=/^\s*([\u{1F1E6}-\u{1F1FF}]{2})/u.exec(String(str||'')); if(!m) return '';
  return Array.from(m[1]).map(function(ch){ return String.fromCharCode(ch.codePointAt(0)-0x1F1E6+65); }).join('');
}
function cleanPart(s){ return s.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}\).]+$/gu,'').trim(); }
function parseNode(x){
  var name=String(x.name||'').trim(), cc=flagCC(name);
  var rest=name.replace(/^\s*[\u{1F1E6}-\u{1F1FF}]{2}/u,'');
  var parts=rest.split(/\s*[·•|]\s*/).map(cleanPart).filter(Boolean);
  var country=CC[cc]||'';
  if(!country){ var first=parts[0]||''; var hit=Object.keys(CC).filter(function(k){return CC[k].toLowerCase()===first.toLowerCase();})[0]; if(hit){ cc=hit; country=CC[hit]; } }
  if(!CC[cc]) cc='';
  var low=country.toLowerCase();
  var rest2=parts.filter(function(p){return p.toLowerCase()!==low;});
  return { guid:x.guid, cc:cc, country:country||'Другие узлы', title:rest2[0]||'', note:rest2.slice(1).join(' · '),
           ping:x.ping||0, selected:!!x.selected, active:!!x.active, available:x.available!==false };
}
function flagImg(cc){ return '<img class="fl" alt="" width="24" height="16" src="flags/'+(cc||'globe')+'.svg">'; }

/* ───────── индикатор задержки ───────── */
function level(ms){ return ms<100?{n:4,c:'c-teal'}:ms<200?{n:3,c:'c-teal'}:ms<300?{n:2,c:'c-amber'}:{n:1,c:'c-orange'}; }
function bars(ms){
  if(ms>0){ var l=level(ms), h='';
    for(var i=1;i<=4;i++) h+='<i'+(i<=l.n?' class="on"':'')+'></i>';
    return '<span class="sig '+l.c+'" role="img" aria-label="Задержка '+Math.round(ms)+' мс" data-lvl="'+l.n+'">'+h+'</span>'; }
  if(ms<0) return '<span class="sigtx" role="img" aria-label="Нет ответа от сервера">Нет ответа</span>';
  return '<span class="sigtx" role="img" aria-label="Задержка не измерена">—</span>';
}
function msText(ms){ return ms>0 ? Math.round(ms)+' мс' : ''; }

function loadServers(){
  var raw=natJSON('servers',[]);
  S.auto=raw.filter(function(x){return x.auto;})[0]||null;
  S.nodes=raw.filter(function(x){return !x.auto;}).map(parseNode);
  S.autoOn=!!(S.auto&&S.auto.selected);
  S.sel=S.nodes.filter(function(n){return n.selected;})[0]||null;
  S.act=S.nodes.filter(function(n){return n.active;})[0]||null;
  if(S.live && !S.nodes.some(function(n){return n.guid===S.live;})) S.live=null;
}
function byGuid(g){ return S.nodes.filter(function(n){return n.guid===g;})[0]||null; }
/* узел текущего сеанса: переносится только по подтверждению VPN-клиента («Подключено»), а не при выборе */
function liveNode(){ return S.live?byGuid(S.live):null; }

/* ───────── состояние VPN ───────── */
function readStats(){
  var st=natJSON('stats',null);
  if(st&&st.since>0){ S.since=st.since; S.off=(st.now||Date.now())-Date.now(); }
  else if(!S.since){ S.since=Date.now()-S.off; }
}
function confirmLive(){ loadServers(); if(S.act) S.live=S.act.guid; }
function setState(st, err){
  if(st==='off' && S.switching && Date.now()<S.switching) return;   // смена узла: клиент перезапускается, «На связи» остаётся на прежнем узле
  if(st==='on'||st==='error') S.switching=0;
  var was=S.state; S.state=st; S.err=(st==='error'?(err||'Не удалось подключиться. Попробуйте сменить локацию'):'');
  if(st==='connecting' && was!=='connecting') S.connAt=Date.now();
  if(st==='on'){ readStats(); confirmLive(); }
  else if(st==='off'||st==='error'){ S.since=0; S.live=null; }
  loadServers(); renderAll();
}
function syncState(){
  var v=nat('vpnState');
  if(v===undefined){ var r=nat('isRunning'); v=r===undefined?undefined:(r?'on':'off'); }
  if(!v) return;
  if(S.state==='error' && v==='off') return;
  if(S.switching && v==='off') return;
  if(v!==S.state) setState(v);
  else if(v==='on'){ readStats(); if(!S.live) confirmLive(); renderHome(); }
}

/* ───────── главная ───────── */

  t.textContent=s==='on'?'Подключено':s==='connecting'?(S.switching?'Переключаю узел…':'Подключение…'):s==='error'?'Ошибка подключения':'Отключено';
  tickTimer();
  var m=$('msg'); m.innerHTML = s==='error' ? esc(S.err)+(S.incident?'<small>Код обращения: '+esc(S.incident)+'</small>':'') : '';
  var act=s==='on'?'Отключиться':s==='connecting'?'Отменить':s==='error'?'Повторить':'Подключиться';
  $('cta').setAttribute('aria-label',act); $('cap').textContent=act;
  $('stage').setAttribute('data-s',s); snowSync();
  var sr=$('srvRow'), live=(s==='on'||S.switching)?liveNode():null, h, label;

    h='<span class="ico24"><svg><use href="#i-globe"/></svg></span><div class="t"><b>Серверов пока нет</b><span>Откройте список серверов</span></div>';
    label='Серверов нет';
  } else if(live){
    h=flagImg(live.cc)+'<div class="t"><b>'+esc(live.country+(live.title?' · '+live.title:''))+'</b><span>'+(S.autoOn?'Автовыбор':'Ручной выбор')+'</span></div>'+bars(live.ping);
    label=live.country+' '+live.title;
  } else if(S.autoOn){
    h='<span class="ico24"><svg><use href="#i-bolt"/></svg></span><div class="t"><b>Автовыбор</b><span>Лучший узел выберется при подключении</span></div>';
    label='Автовыбор';
  } else {
    var n=S.sel||S.nodes[0];
    h=flagImg(n.cc)+'<div class="t"><b>'+esc(n.country+(n.title?' · '+n.title:''))+'</b><span>Ручной выбор</span></div>'+bars(n.ping);
    label=n.country+' '+n.title;
  }
  sr.innerHTML=h+'<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>';
  sr.setAttribute('aria-label','Выбор сервера. '+label);
  var a=S.acct, nh='';
  if(nat('loggedIn')===false && !nat('hasSub')){
    nh='<div class="notice"><b>Нужен вход</b>Войдите или введите ключ — без него подключиться нельзя.<div class="acts"><button class="btn small" type="button" data-a="redeem">Ввести ключ или код</button><button class="btn small ghost" type="button" data-a="cab-profile">Войти через кабинет</button></div></div>';
  } else if(a==='expired'){
    nh='<div class="notice"><b>Подписка закончилась</b>Продлите доступ, чтобы снова подключаться.<div class="acts"><button class="btn small" type="button" data-a="cab-plans">Тарифы и оплата</button></div></div>';
  } else if(a==='device_limit'||a==='blocked'){
    nh='<div class="notice"><b>'+(a==='blocked'?'Доступ заблокирован':'Достигнут лимит устройств')+'</b>Напишите в поддержку — поможем.<div class="acts"><button class="btn small" type="button" data-a="cab-support">Поддержка</button></div></div>';
  } else if(a==='no_account'){
    nh='<div class="notice"><b>Нужен ключ</b>Введите ключ или код активации.<div class="acts"><button class="btn small" type="button" data-a="redeem">Ввести ключ или код</button></div></div>';
  }
  $('notice').innerHTML=nh;
}
function pad(n){ return (n<10?'0':'')+n; }
function tickTimer(){
  var el=$('timer');
  if(S.state!=='on'||!S.since){ el.textContent=''; return; }
  var sec=Math.max(0,Math.floor((Date.now()+S.off-S.since)/1000));
  el.textContent='Время сеанса · '+pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec/60)%60)+':'+pad(sec%60);
}
function onPower(){
  var n=Date.now(); if(n<S.lockUntil) return; S.lockUntil=n+900;
  if(S.state==='on'||S.state==='connecting'){ S.switching=0; nat('disconnect'); setState('off'); return; }
  startConnect();
}
function startConnect(){ S.err=''; nat('haptic'); setState('connecting'); nat('connect'); }

/* ───────── серверы ───────── */
function groupNodes(){
  var order=[], map={};
  S.nodes.forEach(function(n){ var k=n.cc||'other'; if(!map[k]){ map[k]={key:k,cc:n.cc,country:n.country,nodes:[]}; order.push(k);} map[k].nodes.push(n); });
  return order.map(function(k){return map[k];});
}
function detail(n){ var p=[]; if(n.note) p.push(n.note); var t=msText(n.ping); if(t) p.push(t); return p.join(' · '); }
function nodeRow(n, inGroup){
  var isLive=S.live===n.guid && (S.state==='on'||S.switching);
  var cls='row'+((!S.autoOn&&n.selected)?' sel':'')+(n.available?'':' off');
  var title=inGroup?(n.title||n.country):n.country;
  var sub=inGroup?detail(n):[n.title,detail(n)].filter(Boolean).join(' · ');
  if(!n.available) sub='Сейчас занят'+(sub?' · '+sub:'');
  return '<button type="button" class="'+cls+'" data-pick="'+esc(n.guid)+'" role="radio" aria-checked="'+((!S.autoOn&&n.selected)?'true':'false')+'">'
    +(inGroup?'':flagImg(n.cc))+'<div class="t"><b>'+esc(title)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>'
    +(isLive?'<span class="live">На связи</span>':'')+bars(n.ping)+'</button>';
}
function renderServers(){
  var el=$('s-servers'), h='';
  h+='<div class="head"><h1>Серверы</h1><button type="button" class="chk" data-a="ping"'+(S.pingBusy?' disabled':'')+'>'+(S.pingBusy?'Замеряю…':'Проверить')+'</button></div>';
  if(!S.nodes.length){
    h+='<div class="card" style="padding:1rem var(--gut)"><b>Список серверов пуст</b><p class="sub" style="margin:.4rem 0 .8rem">Серверы появятся после получения ключа. Если ключ уже есть — обновите подписку.</p><div class="acts"><button class="btn small" type="button" data-a="redeem">Ввести ключ или код</button><button class="btn small ghost" type="button" data-a="refreshSub">Обновить подписку</button></div></div>';
    el.innerHTML=h; return;
  }
  var live=liveNode(), on=S.state==='on'||S.switching;
  if(S.auto){
    var asub=S.autoOn ? (on&&live?'Сейчас через '+(live.title||live.country):'Самый быстрый узел из '+S.nodes.length) : 'Выключен — выбран сервер вручную';
    h+='<div class="card auto"><button type="button" class="row'+(S.autoOn?' sel':'')+'" data-pick="auto" role="radio" aria-checked="'+(S.autoOn?'true':'false')+'"><span class="ico24"><svg><use href="#i-bolt"/></svg></span><div class="t"><b>Автовыбор</b><span>'+esc(asub)+'</span></div></button></div>';
  }
  h+='<div class="card" role="radiogroup" aria-label="Выбор сервера">';
  groupNodes().forEach(function(g){
    if(g.nodes.length===1){ h+=nodeRow(g.nodes[0],false); return; }
    var open=!!S.open[g.key];
    var hasLive=on&&g.nodes.some(function(n){return n.guid===S.live;});
    var shown=null;                                   // индикатор у свёрнутой страны — только если понятно, о каком узле речь
    if(hasLive) shown=byGuid(S.live); else if(!S.autoOn) shown=g.nodes.filter(function(n){return n.selected;})[0]||null;
    h+='<div class="grp'+(open?' open':'')+'"><button type="button" class="row" data-grp="'+esc(g.key)+'" aria-expanded="'+(open?'true':'false')+'">'+flagImg(g.cc)
      +'<div class="t"><b>'+esc(g.country)+'</b><span>'+g.nodes.length+' '+plural(g.nodes.length,'сервер','сервера','серверов')+'</span></div>'
      +((!open&&hasLive)?'<span class="live">На связи</span>':'')+((!open&&shown)?bars(shown.ping):'')
      +'<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button><div class="nodes">'+g.nodes.map(function(n){return nodeRow(n,true);}).join('')+'</div></div>';
  });
  h+='</div>';
  if(S.nodes.length===1) h+='<p class="note">В вашей подписке один сервер — он выбран и используется для всех подключений. Автовыбор включится, когда появятся другие серверы.</p><div class="acts" style="margin-top:.75rem"><button class="btn small ghost" type="button" data-a="cab-plans">Тарифы и серверы</button></div>';
  el.innerHTML=h;
}
function pick(guid){
  var n=Date.now(); if(n<S.lockUntil) return; S.lockUntil=n+500;
  if(guid==='auto'){ if(S.autoOn){ go('home'); return; } }
  else { var nd=byGuid(guid);
    if(nd&&!S.autoOn&&nd.selected){ go('home'); return; }
    if(nd&&!nd.available){ toast('Этот сервер сейчас перегружен — выберите другой или Автовыбор'); return; } }
  nat('select',guid);
  var was=S.state; loadServers();
  if(was==='on'||was==='connecting'){ S.switching=Date.now()+12000; S.state='connecting'; S.connAt=Date.now(); }
  var nm=guid==='auto'?'Автовыбор':((byGuid(guid)||{}).country||'Сервер');
  toast(was==='on'||was==='connecting'?'Переключаю на: '+nm:(nm+' выбран. Нажмите «Подключиться»'));
  go('home');
}
function doPing(){
  if(S.pingBusy) return; S.pingBusy=true; S.pingAt=Date.now(); renderServers(); nat('pingAll');
  setTimeout(function(){ if(S.pingBusy){ S.pingBusy=false; loadServers(); renderAll(); } },14000);
}

function ask(){
  var tok=''; try{ tok=localStorage.getItem('sc_tok')||''; }catch(e){}
  if(!tok) return;
  var ctl=window.AbortController?new AbortController():null, tm=setTimeout(function(){ctl&&ctl.abort();},9000);

    .then(function(r){return r.json();}).then(function(d){ if(d&&d.ok!==false){ S.me={name:d.name,status:d.status,until:d.until,channel:d.channel}; if(S.tab==='settings') renderSettings(); } })
    .catch(function(){}).then(function(){clearTimeout(tm);});
}

    case 'redeem': nat('redeemDialog'); break;
    case 'refreshSub': refreshSub(); break;
    case 'key': nat('openCabinet','key'); break;
    case 'bonus': nat('openCabinet','bonus'); break;
    case 'tg': nat('linkTelegram'); break;
    case 'tv': openTv(); break;
    case 'logout': openLogout(); break;

  }
}

/* ───────── шторки ───────── */

/* ───────── навигация, события ───────── */
function go(t){
  S.tab=t;
  ['home','servers','settings'].forEach(function(x){ $('s-'+x).classList.toggle('on',x===t); });
  document.querySelectorAll('.nav button').forEach(function(b){ var on=b.getAttribute('data-t')===t; b.classList.toggle('on',on); b.setAttribute('aria-current',on?'page':'false'); });
  loadServers(); renderAll(); window.scrollTo(0,0);
  if(t==='servers'&&!S.pingBusy&&Date.now()-S.pingAt>30000&&S.state!=='connecting') doPing();
  if(t==='settings') ask();
}
function renderAll(){ renderHome(); if(S.tab==='servers') renderServers(); if(S.tab==='settings') renderSettings(); }
var tt; function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){e.classList.remove('on');},3000); }

window.scNative=function(ev){
  if(!ev) return;
  switch(ev.type){
    case 'state': setState(ev.state,ev.error); break;
    case 'toast': if(ev.text) toast(ev.text); break;
    case 'pings': S.pingBusy=false; loadServers(); renderAll(); break;
    case 'incident': S.incident=ev.code||''; renderHome(); break;
    case 'account': S.acct=ev.state||''; renderAll(); break;
    case 'sub': S.acct=''; loadServers(); renderAll(); toast(ev.ok?'Подписка обновлена: '+(ev.count||0)+' '+plural(ev.count||0,'сервер','сервера','серверов'):(ev.error||'Не удалось обновить подписку')); break;
    case 'apps': if(appsState){ appsState.loading=false; if(ev.error) appsState.error=ev.error; else { appsState.on=!!ev.on; appsState.list=ev.list||[]; } renderApps(); } break;
  }
};
window.scBack=function(){
  if($('sheet').classList.contains('on')){ closeSheet(); return true; }
  if(S.tab!=='home'){ go('home'); return true; }
  return false;
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-t],[data-pick],[data-grp],[data-r],[data-a],[data-app]'); if(!t) return;
  if(t.hasAttribute('data-t')) return go(t.getAttribute('data-t'));
  if(t.hasAttribute('data-pick')) return pick(t.getAttribute('data-pick'));
  if(t.hasAttribute('data-grp')){ var k=t.getAttribute('data-grp'); S.open[k]=!S.open[k]; return renderServers(); }
  if(t.hasAttribute('data-r')) return onRow(t.getAttribute('data-r'));
  if(t.hasAttribute('data-app')){ var p=t.getAttribute('data-app'); appsState.list.forEach(function(x){ if(x.pkg===p) x.sel=!x.sel; }); return renderApps(); }
  var a=t.getAttribute('data-a');
  switch(a){
    case 'ping': doPing(); break;
    case 'redeem': nat('redeemDialog'); break;
    case 'refreshSub': refreshSub(); break;
    case 'close': closeSheet(); break;
    case 'logoutGo': closeSheet(); nat('logout'); break;
    case 'tvGo': var c=($('tvcode')||{}).value||''; if(c.replace(/\D/g,'').length<6){ toast('Введите код с экрана телевизора'); break; } closeSheet(); nat('tvApprove',c.trim()); toast('Проверяю код…'); break;
    case 'appsMaster': appsState.on=!appsState.on; renderApps(); break;
    case 'appsSave': var set=appsState.list.filter(function(x){return x.sel;}).map(function(x){return x.pkg;}); nat('setDirect',appsState.on,JSON.stringify(set)); closeSheet(); toast(S.state==='on'?'Применяю — VPN перезапустится':'Сохранено'); setTimeout(renderSettings,200); break;
    default: if(a&&a.indexOf('cab-')===0) nat('openCabinet',a.slice(4));
  }
});
document.addEventListener('input',function(e){ if(e.target.id==='appq'&&appsState){ appsState.q=e.target.value; renderApps(); } });
$('shade').addEventListener('click',closeSheet);
$('cta').addEventListener('click',onPower);
$('srvRow').addEventListener('click',function(){ go('servers'); });

/* возврат из фона: статус и таймер берутся из фактического состояния VPN-клиента */
function resume(){ syncState(); loadServers(); renderAll(); setTimeout(syncState,800); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) resume(); });
window.addEventListener('focus',resume);
window.addEventListener('pageshow',resume);

setInterval(function(){
  tickTimer();
  if(S.switching&&Date.now()>S.switching){ S.switching=0; syncState(); }
  if(S.state==='connecting'){
    var el=Date.now()-S.connAt;
    if(el>1500&&Math.round(el/1500)!==S._pl){ S._pl=Math.round(el/1500); var v=nat('vpnState'); if(v==='on') setState('on'); else if(v==='off'&&el>5000&&!S.switching) setState('error','Подключение прервано. Попробуйте ещё раз'); }
    if(el>45000) setState('error','Сервер долго не отвечает. Попробуйте сменить локацию');
  } else if(S.state==='on'&&S.tab!=='settings'&&Date.now()%10000<1000){ loadServers(); if(S.tab==='servers') renderServers(); renderHome(); }
},1000);

/* высота нижней навигации — для отступа содержимого (нужна при крупном шрифте) */
function navH(){ document.documentElement.style.setProperty('--navh',$('nav').offsetHeight+'px'); }
window.addEventListener('resize',navH);
if(window.ResizeObserver) new ResizeObserver(navH).observe($('nav'));

/* ───────── снег: мелкие частицы разной глубины, только в области кнопки; не крутится, пока экран скрыт ───────── */
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var snow={ps:[],raf:0,last:0,offAt:0,ctx:null,w:0,h:0};
function snowInit(){
  var cv=$('snow'), dpr=Math.min(2,window.devicePixelRatio||1), w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return false;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); snow.ctx=cv.getContext('2d'); snow.ctx.setTransform(dpr,0,0,dpr,0,0); snow.w=w; snow.h=h;
  if(!snow.ps.length) for(var i=0;i<18;i++){ var z=0.3+0.7*Math.random(); snow.ps.push({x:Math.random(),y:Math.random(),z:z,ph:Math.random()*6.28}); }
  return true;
}
function snowTick(ts){
  snow.raf=0;
  var want=S.state==='on'&&!document.hidden&&!reduce;
  if(!want && ts-snow.offAt>1500){ if(snow.ctx) snow.ctx.clearRect(0,0,snow.w,snow.h); return; }
  if(document.hidden) return;
  if(!snow.w && !snowInit()){ snow.raf=requestAnimationFrame(snowTick); return; }
  var dt=snow.last?Math.min(0.1,(ts-snow.last)/1000):0.016; snow.last=ts;
  var c=snow.ctx, k=snow.w/288; c.clearRect(0,0,snow.w,snow.h);
  for(var i=0;i<snow.ps.length;i++){
    var p=snow.ps[i];
    p.y+=(6+p.z*13)*k*dt/snow.h; p.x+=Math.sin(ts/2600+p.ph)*(2+p.z*3)*k*dt/snow.w;
    if(p.y>1.02){ p.y=-0.02; p.x=Math.random(); } if(p.x<0)p.x+=1; if(p.x>1)p.x-=1;
    c.globalAlpha=0.3+0.55*p.z; c.fillStyle='#EAF6FF';
    c.beginPath(); c.arc(p.x*snow.w,p.y*snow.h,(0.7+p.z*1.7)*k,0,6.283); c.fill();
  }
  c.globalAlpha=1; snow.raf=requestAnimationFrame(snowTick);
}
function snowSync(){
  if(S.state!=='on') snow.offAt=performance.now();
  if(!snow.raf && S.state==='on' && !document.hidden && !reduce){ snow.last=0; snow.raf=requestAnimationFrame(snowTick); }
  else if(!snow.raf && S.state!=='on' && snow.ctx && performance.now()-snow.offAt<1500 && !document.hidden){ snow.raf=requestAnimationFrame(snowTick); }
}
document.addEventListener('visibilitychange',function(){ if(document.hidden){ if(snow.raf){ cancelAnimationFrame(snow.raf); snow.raf=0; } } else snowSync(); });

window.__ice={level:level,bars:bars,S:S,snow:snow,sync:snowSync,reduce:reduce};   // для проверок на стенде

(function init(){
  navH();
  S.build=natJSON('buildInfo',null); S.acct=nat('account')||'';
  loadServers();
  var v=nat('vpnState'); if(v===undefined){ var r=nat('isRunning'); v=r?'on':'off'; }
  S.state=v||'off'; if(S.state==='on'){ readStats(); confirmLive(); }
  renderAll(); nat('pingAll'); S.pingAt=Date.now(); setTimeout(syncState,900);
})();
})();
</script>
